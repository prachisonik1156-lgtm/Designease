<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup Page</title>
<link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
<style>
  /* ── Error Toast ── */
  #error-toast {
    display: none;
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff4d4d;
    color: #fff;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    z-index: 9999;
    align-items: center;
    gap: 10px;
    min-width: 280px;
    text-align: center;
    animation: slideDown 0.4s ease;
  }
  #error-toast.show { display: flex; justify-content: center; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateX(-50%) translateY(-30px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>
</head>

<body>

<!-- Error Toast -->
<div id="error-toast">
  ❌ <span id="error-msg">{{ error }}</span>
</div>

<div class="container">

  <!-- LEFT SIGNUP -->
  <div class="left">
    <h1>Create Account</h1><br>

    <form method="POST" action="{{ url_for('signup') }}">
      <input type="text"     name="username" placeholder="Username" required>
      <input type="email"    name="email"    placeholder="Email"    required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>

    <div class="forgot">
      <a href="{{ url_for('login') }}">Already have an account? Login</a>
    </div>
  </div>

  <!-- RIGHT IMAGE -->
  <div class="right">
    <img src="{{ url_for('static', filename='signup.jpeg') }}" alt="Signup Illustration">
  </div>

</div>

{% if error %}
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var toast = document.getElementById('error-toast');
    toast.classList.add('show');
    setTimeout(function () {
      toast.style.transition = 'opacity 0.4s ease';
      toast.style.opacity = '0';
      setTimeout(function () { toast.classList.remove('show'); toast.style.opacity = ''; }, 400);
    }, 4000);
  });
</script>
{% endif %}

</body>
</html>
