<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Under Maintenance — DesignEase</title>
  <style>
    body { font-family: sans-serif; background: #eef7f6; display: flex;
           align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { text-align: center; background: #fff; padding: 60px 40px;
           border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
    h1 { font-size: 48px; margin-bottom: 8px; }
    h2 { color: #2aa6a6; font-size: 24px; margin-bottom: 16px; }
    p  { color: #6b9999; font-size: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔧</h1>
    <h2>Under Maintenance</h2>
    <p>We'll be back shortly. Thank you for your patience.</p>
  </div>
</body>
</html>
