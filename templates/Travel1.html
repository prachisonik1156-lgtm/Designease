<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Travel Template 1</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  background:#1a1a2e;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  font-family:'Segoe UI',sans-serif;
  padding:20px;
}
.card{
  width:700px;
  height:480px;
  position:relative;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
}

/* BG image */
.bg{
  position:absolute;
  inset:0;
  cursor:pointer;
}
.bg img{ width:100%; height:100%; object-fit:cover; }
.bg::after{
  content:"Click to change photo";
  position:absolute; inset:0;
  background:rgba(0,0,0,0.4);
  color:#fff; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:0.3s;
}
.bg:hover::after{ opacity:1; }

/* Gradient overlays */
.overlay-left{
  position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
}
.overlay-bottom{
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%);
}

/* Content left */
.content{
  position:absolute;
  left:0; top:0; bottom:0;
  width:58%;
  padding:40px 44px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  z-index:2;
}

.top-section{ display:flex; flex-direction:column; gap:12px; }

.destination-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
  color:#fff;
  font-size:12px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:6px 16px;
  border-radius:20px;
  width:fit-content;
  backdrop-filter:blur(8px);
}

.destination-name{
  font-size:52px;
  font-weight:800;
  color:#ffffff;
  line-height:1.05;
  letter-spacing:-1px;
  text-shadow:0 2px 20px rgba(0,0,0,0.3);
}

.country{
  font-size:18px;
  color:rgba(255,255,255,0.65);
  font-weight:400;
  letter-spacing:3px;
  text-transform:uppercase;
}

.desc{
  font-size:14px;
  color:rgba(255,255,255,0.7);
  line-height:1.7;
  max-width:320px;
}

/* Bottom info */
.bottom-section{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.info-row{
  display:flex;
  gap:28px;
}

.info-item{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.info-label{
  font-size:10px;
  color:rgba(255,255,255,0.4);
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.info-value{
  font-size:15px;
  color:#ffffff;
  font-weight:600;
}

.book-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg,#f59e0b,#f97316);
  color:#fff;
  border:none;
  border-radius:30px;
  padding:13px 28px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  width:fit-content;
  letter-spacing:0.3px;
  box-shadow:0 6px 20px rgba(249,115,22,0.4);
  transition:transform 0.2s, box-shadow 0.2s;
}
.book-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 28px rgba(249,115,22,0.5);
}

/* Right card - weather/price */
.right-card{
  position:absolute;
  right:28px; top:28px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:16px;
  padding:20px 22px;
  text-align:center;
  z-index:3;
  min-width:120px;
}

.temp{
  font-size:38px;
  font-weight:800;
  color:#fff;
}
.weather-desc{
  font-size:12px;
  color:rgba(255,255,255,0.6);
  margin-top:2px;
}
.price-divider{
  border:none;
  border-top:1px solid rgba(255,255,255,0.15);
  margin:12px 0;
}
.price-label{
  font-size:10px;
  color:rgba(255,255,255,0.45);
  text-transform:uppercase;
  letter-spacing:1px;
}
.price{
  font-size:22px;
  font-weight:800;
  color:#f59e0b;
  margin-top:3px;
}

/* Bottom strip */
.bottom-strip{
  position:absolute;
  bottom:0; left:0; right:0;
  height:48px;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  padding:0 40px;
  gap:28px;
  z-index:3;
}

.strip-item{
  display:flex;
  align-items:center;
  gap:7px;
  color:rgba(255,255,255,0.65);
  font-size:13px;
}

#bgInput{ display:none; }
[contenteditable="true"]:hover{ background:rgba(255,255,255,0.12); border-radius:4px; outline:none; }
[contenteditable="true"]:focus{ outline:none; }
</style>
</head>
<body>

<div class="card">

  <!-- BG -->
  <div class="bg" onclick="document.getElementById('bgInput').click()">
    <img id="bgImg" src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=1200&h=800&fit=crop&auto=format">
  </div>
  <input type="file" id="bgInput" accept="image/*">

  <div class="overlay-left"></div>
  <div class="overlay-bottom"></div>

  <!-- Content -->
  <div class="content">
    <div class="top-section">
      <div class="destination-tag" contenteditable="true">🌏 Top Destination</div>
      <div class="destination-name" contenteditable="true">BALI</div>
      <div class="country" contenteditable="true">Indonesia</div>
      <div class="desc" contenteditable="true">
        Experience paradise on earth — pristine beaches, ancient temples, and lush rice terraces await.
      </div>
    </div>
    <div class="bottom-section">
      <div class="info-row">
        <div class="info-item">
          <div class="info-label">Duration</div>
          <div class="info-value" contenteditable="true">7 Days</div>
        </div>
        <div class="info-item">
          <div class="info-label">Best Time</div>
          <div class="info-value" contenteditable="true">Apr – Oct</div>
        </div>
        <div class="info-item">
          <div class="info-label">Rating</div>
          <div class="info-value" contenteditable="true">⭐ 4.9</div>
        </div>
      </div>
      <button class="book-btn" contenteditable="true">✈ Book Now</button>
    </div>
  </div>

  <!-- Right card -->
  <div class="right-card">
    <div class="temp" contenteditable="true">28°C</div>
    <div class="weather-desc" contenteditable="true">☀️ Sunny</div>
    <hr class="price-divider">
    <div class="price-label">From</div>
    <div class="price" contenteditable="true">$899</div>
  </div>

  <!-- Bottom strip -->
  <div class="bottom-strip">
    <div class="strip-item"><span>✈️</span><span contenteditable="true">Direct Flights</span></div>
    <div class="strip-item"><span>🏨</span><span contenteditable="true">5-Star Hotels</span></div>
    <div class="strip-item"><span>🍽️</span><span contenteditable="true">All Inclusive</span></div>
    <div class="strip-item"><span>📸</span><span contenteditable="true">Guided Tours</span></div>
  </div>

</div>

<script>
document.getElementById('bgInput').addEventListener('change',function(e){
  const file=e.target.files[0];
  if(file){ const r=new FileReader(); r.onload=ev=>document.getElementById('bgImg').src=ev.target.result; r.readAsDataURL(file); }
});
</script>
</body>
</html>
